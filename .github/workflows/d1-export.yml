name: Export the recorded data (read-only)

# MANUAL ONLY — runs nothing on its own. Every query is a read; nothing is written.
#
# Why this exists: the Worker records every post minute by minute for 48 hours, every 15
# minutes to day 14 and hourly to day 60, and holds it all in D1 — but nothing ever let
# that record out as a file. The dashboard's own "Export saved data" is the browser's copy
# (launch curves plus whatever three-day windows that device pulled), which cannot answer
# how long a post keeps earning, whether it gets a second push, or whether a new upload
# lifts the older ones. This reads the whole record out as CSV (samples, posts, a per-post
# summary at fixed ages, and the TikTok follower log) and attaches it to the run as an
# artifact: Actions → this run → Artifacts → download the zip.
#
# This repo is public, so the artifact is downloadable by anyone signed in to GitHub.
# Everything in it is already public on the platforms (view, like, comment and share
# counts, captions, publish times, follower counts) except the TikTok open_id, which is
# pseudonymous but not for publishing — scripts/d1-export.mjs cuts it to the same four
# characters the peek workflow prints and never writes it whole. Keep it that way.
#
# Cost: each query seeks on the covering index and reads only the rows it returns, so a
# full 60-day export reads about as many rows as it exports (a few hundred thousand) out of
# D1's 5,000,000-a-day allowance. Fine to run whenever it is wanted; not something to
# schedule every hour.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back (the Worker keeps 60; more just finds nothing)'
        default: '60'
        required: false
      platform:
        description: 'Which platform'
        type: choice
        options: [all, tiktok, youtube]
        default: all

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler requires Node >= 22

      # The script runs wrangler from worker/ (so wrangler.toml is found) and writes the
      # folder here at the repo root. Inputs go in through the environment rather than
      # being pasted into the command line.
      - name: Read the recordings out of D1 and KV
        env:
          DAYS: ${{ inputs.days }}
          PLATFORM: ${{ inputs.platform }}
        run: node scripts/d1-export.mjs --out export --days "${DAYS:-60}" --platform "${PLATFORM:-all}"

      - name: Name the download after the moment it was taken
        id: stamp
        run: echo "stamp=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Attach the folder to this run
        uses: actions/upload-artifact@v4
        with:
          name: recorded-data-${{ steps.stamp.outputs.stamp }}
          path: export/
          if-no-files-found: error
          retention-days: 14

      - name: Where to find it
        run: |
          echo "Done. Open this run's summary page and download 'recorded-data-${{ steps.stamp.outputs.stamp }}'"
          echo "under Artifacts — a zip of samples.csv, videos.csv, posts.csv, followers.csv and README.txt."
          echo "It is kept for 14 days; run this again for a fresh one."
