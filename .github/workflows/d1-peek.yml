name: Peek at the live data (read-only)

# MANUAL ONLY — runs nothing on its own. Every query is a read; nothing is written.
#
# Why this exists: the dashboards read D1 through the Worker, but there was no way to ask
# "what is actually being served right now?" without opening the site and screenshots.
# This prints it in an Actions log instead. The primary step needs no credentials at all —
# it asks the Worker's own public route, the same one the dashboards call.
#
# This repo is public, so its action logs are public too. Everything printed here is
# either aggregate (counts, timestamps) or already-public (video ids, publish times,
# view counts served by the public route). TikTok rows are partitioned by account
# open_id — that id is pseudonymous but not for publishing, so platforms are collapsed
# to 'tiktok' before printing and the accounts list is reduced to a count without the
# raw value ever reaching the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler requires Node >= 22

      # No credentials involved: this is the same public route the dashboards poll.
      # X-CC-Source names the store that answered (d1, or kv if D1 fell back).
      - name: What the Worker is actually serving
        if: always()
        run: |
          curl -sS -D /tmp/headers "https://yt.reubenrichardson37.workers.dev/" -o /tmp/bundle.json
          echo "answered by: $(grep -i '^x-cc-source' /tmp/headers | tr -d '\r')"
          echo "videos in the served bundle:"
          jq -r '.videos | to_entries[] |
            "  \(.key)  pub=\(.value.pub)  samples=\(.value.s | length)  last_sample=\((.value.s[-1][0] / 1000) | floor | todate)  views_now=\(.value.s[-1][1])"' /tmp/bundle.json
          echo "total samples served: $(jq '[.videos[].s | length] | add // 0' /tmp/bundle.json)"

      # The tracker is supposed to write one sample per video per minute. This prints the
      # gap distribution between consecutive samples so a double-writer (gaps far below
      # 60s) or a stall (gaps far above) is visible as data instead of a hunch.
      - name: Sampling cadence per video
        if: always()
        run: |
          jq -r '.videos | to_entries[] |
            .key as $id | [.value.s[][0]] as $t |
            [range(1; $t | length) | ($t[.] - $t[. - 1]) / 1000] as $d |
            "  \($id)  gaps<50s=\([$d[] | select(. < 50)] | length)  " +
            "~60s=\([$d[] | select(. >= 50 and . <= 70)] | length)  " +
            ">70s=\([$d[] | select(. > 70)] | length)  " +
            "last_sub50s_at=\((([range(1; $t | length) | select(($t[.] - $t[. - 1]) < 50000) | $t[.]] | last // 0) / 1000) | floor | todate)"' /tmp/bundle.json

      # The cadence step showed ~60% of gaps falling under 50s, which means something is
      # writing more than once a minute. Printing raw consecutive timestamps in ms says
      # whether those are near-simultaneous duplicates (a double-firing cron) or a genuine
      # second sampler on a different phase.
      - name: Raw timestamps of the newest samples
        if: always()
        run: |
          jq -r '.videos | to_entries | max_by(.value.s[-1][0]) |
            .key as $id | (.value.s[-14:]) as $tail |
            "  newest 14 samples of \($id):",
            ( $tail[] | "    ts=\(.[0])  \((.[0]/1000)|floor|todate)  +\(.[0] % 60000)ms  views=\(.[1])" )' /tmp/bundle.json

      # Why the plateau projection is or isn't speaking. It needs REFERENCE CURVES: the
      # first 48 hours of launches that already finished. The bundle above cannot carry
      # those — it cuts on an absolute timestamp — so they come from /launches instead,
      # and if this step reports fewer than two usable curves the card is correctly
      # staying quiet rather than being broken.
      #
      # The pass/fail rules mirror the model in the page: a curve must reach at least 44h
      # of age, and no gap may exceed a quarter of the age at which it ends (floor 60m),
      # which is what separates a missed cron in the flat tail from the 21-hour holes the
      # 6h→48h window change left behind.
      - name: Reference curves for the projection
        if: always()
        run: |
          curl -sS "https://yt.reubenrichardson37.workers.dev/launches" -o /tmp/launches.json
          jq -r 'if .error then "ERROR: \(.error)"
                 else "served \(.curves | length) finished launches  (cached at \((.at/1000)|floor|todate), one point per \(.step) min)" end' /tmp/launches.json
          jq -r '(.curves // {}) | to_entries[] |
            .key as $id | [.value.s[][0]] as $a |
            ([range(1; $a|length) | select(($a[.] - $a[.-1]) > ([60, ($a[.] / 4)] | max))] | length) as $holes |
            "  \($id)  points=\($a|length)  first=\($a[0])m  last=\($a[-1])m  final=\(.value.s[-1][1]) views  " +
            (if ($a[-1] >= 2640 and $holes == 0) then "USABLE" else "rejected: " +
              (if $a[-1] < 2640 then "stops at \(($a[-1]/60)|floor)h" else "\($holes) hole(s) where it matters" end) end)' /tmp/launches.json
          jq -r '[(.curves // {}) | to_entries[] | select((([.value.s[][0]]) as $a |
                   $a[-1] >= 2640 and ([range(1; $a|length) | select(($a[.] - $a[.-1]) > ([60, ($a[.] / 4)] | max))] | length) == 0))] | length as $n |
                 "usable references: \($n) — " +
                 (if $n >= 3 then "enough to measure the margin from your own curves"
                  elif $n == 2 then "enough to project, margin falls back to the recorded defaults"
                  else "NOT ENOUGH; the card will say so" end)' /tmp/launches.json

      # Where the TikTok pipeline stops. An account is connected but D1 holds no TikTok
      # rows at all, and the difference between "no token", "token expired", "no posts in
      # the window" and "written but not mirrored" is four different fixes. Every value
      # here is derived — the open_id and the access token never reach the log.
      - name: TikTok pipeline state
        if: always()
        env:
          NS: 24a3e8ab02904af499a07b6928687b48
        run: |
          # `|| true` matters: wrangler exits non-zero for a key that does not exist, and
          # under `bash -e` that killed the whole step the first time a diagnostic key was
          # read before anything had written it. A missing key is an expected answer here,
          # not a failure — every caller below already handles the empty string.
          kv() { npx wrangler@latest kv key get "$1" --namespace-id "$NS" --remote 2>/dev/null || true; }

          # How the most recent sign-in ATTEMPT ended. Absence is meaningful: TikTok shows
          # its own error page for anything it rejects before redirecting, so a failed
          # attempt that leaves no record here was refused upstream — a developer-portal
          # problem, not a Worker one.
          start=$(kv tt:laststart); last=$(kv tt:lastauth)
          s_at=$(printf '%s' "$start" | jq -r '.at // 0' 2>/dev/null || echo 0)
          f_at=$(printf '%s' "$last"  | jq -r '.at // 0' 2>/dev/null || echo 0)
          if [ "${s_at:-0}" = "0" ]; then
            echo "last attempt   : nobody has pressed sign-in since this was deployed"
          else
            printf '%s' "$start" | jq -r '"attempt started: \((.at/1000)|floor|todate)\(if .reauth then "  (via Use a different account)" else "  (plain sign-in — TikTok may reuse the browsers current account)" end)"'
            if [ "${f_at:-0}" = "0" ] || [ "${f_at:-0}" -lt "${s_at:-0}" ]; then
              echo "           ...  : NO CALLBACK followed it — TikTok rejected the attempt on its own"
              echo "                  error page and never returned. That is a developer-portal"
              echo "                  problem (target user / sandbox), not a Worker one."
            else
              printf '%s' "$last" | jq -r '"           ...  : \(if .ok then "SUCCEEDED" else "came back FAILED — " + .error end)  at=\((.at/1000)|floor|todate)"'
            fi
          fi

          accounts=$(kv tt:accounts)
          n=$(printf '%s' "$accounts" | jq -r 'length' 2>/dev/null || echo 0)
          echo "accounts connected: ${n:-0}"
          # `[ ] && exit` leaves a non-zero status behind when the test is false, so it is
          # written as a real if-block rather than relying on short-circuit luck
          if [ "${n:-0}" -eq 0 ]; then exit 0; fi

          # report EVERY connected account, not just the first — the whole point now is
          # watching a second one arrive
          for oid in $(printf '%s' "$accounts" | jq -r '.[]'); do
          echo "--- account $(printf '%s' "$oid" | cut -c1-4)… ---"
          tok=$(kv "tt:tok:$oid")
          if [ -z "$tok" ]; then
            echo "access token   : MISSING — the account is listed but has no stored token"
          else
            printf '%s' "$tok" | jq -r --argjson now "$(date +%s000)" '
              "access token   : present, expires_at=\(((.expires_at // 0)/1000)|floor|todate) " +
              (if ((.expires_at // 0) > $now) then "(valid)" else "(EXPIRED — refresh needed)" end)'
          fi

          snap=$(kv "tt:snap:$oid")
          if [ -z "$snap" ]; then
            echo "snapshot       : MISSING — the cron has never recorded this account"
          else
            printf '%s' "$snap" | jq -r '
              "snapshot       : videos=\((.videos // {}) | length)  d1Backfilled=\(.d1Backfilled // "unset")  updated=\(((.updated // 0)/1000)|floor|todate)",
              "last list call : \(.ttHealth // "not recorded yet — needs a deploy plus one cron tick")\(if .ttHealthAt then "  at=" + (((.ttHealthAt)/1000)|floor|todate) else "" end)",
              ((.videos // {}) | to_entries[] |
                "    post samples=\(.value.s | length)  posted=\((.value.create_time // 0)|todate)  " +
                "age_h=\((((now - (.value.create_time // 0)) / 3600) * 10 | floor) / 10)")'
          fi

          # The profile's own post count, read from the follower history where it already
          # lives as the 4th column. It settles what the video list alone cannot: an empty
          # list from a profile claiming 0 posts is an account with nothing to track, while
          # an empty list from a profile claiming dozens means TikTok is withholding them.
          fh=$(kv "tt:followers:$oid")
          if [ -z "$fh" ]; then
            echo "profile claims : not sampled yet (polled every ~3h)"
          else
            printf '%s' "$fh" | jq -r 'if length == 0 then "profile claims : no samples yet"
              else (.[-1]) as $l | "profile claims : \($l[3]) posts, \($l[1]) followers  at=\((($l[0])/1000)|floor|todate)" end'
          fi
          done
          echo "note: D1 rows for an account appear under platform 'tt:<open_id>'"

      # These two need the D1 permission on CLOUDFLARE_API_TOKEN, which the current token
      # does not have (every CI call to a /d1/ API endpoint has been denied: code 10000 on
      # import, 7403 on query). They are non-blocking so the credential-free steps above
      # still report; once the token gains "Account / D1 / Edit" these light up too.
      - name: Direct D1 counts (needs the D1 permission on the token)
        if: always()
        continue-on-error: true
        run: |
          npx wrangler@latest d1 execute channel-command --remote --json --command "
            SELECT CASE WHEN platform LIKE 'tt:%' THEN 'tiktok' ELSE 'youtube' END AS platform,
                   COUNT(*) AS samples,
                   COUNT(DISTINCT video_id) AS videos,
                   datetime(MIN(ts)/1000,'unixepoch') AS oldest_utc,
                   datetime(MAX(ts)/1000,'unixepoch') AS newest_utc
            FROM samples GROUP BY 1"

      - name: Direct D1 video list (needs the D1 permission on the token)
        if: always()
        continue-on-error: true
        run: |
          npx wrangler@latest d1 execute channel-command --remote --json --command "
            SELECT CASE WHEN v.platform LIKE 'tt:%' THEN 'tiktok' ELSE 'youtube' END AS platform,
                   v.video_id,
                   datetime(v.published_at/1000,'unixepoch') AS published_utc,
                   ROUND((unixepoch()*1000.0 - v.published_at)/3600000, 1) AS age_hours,
                   (SELECT COUNT(*) FROM samples s
                     WHERE s.platform = v.platform AND s.video_id = v.video_id) AS samples
            FROM videos v ORDER BY v.published_at DESC LIMIT 12"
