name: Deploy per-minute Worker to Cloudflare

# Deploys worker/ to Cloudflare and pushes the runtime secrets from GitHub secrets,
# so the keys live only in GitHub (for the robot) and Cloudflare (as encrypted Worker
# secrets) — never in the repo. Runs on any change to the Worker, or on demand.
on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler requires Node >= 22
      # Apply the D1 schema before deploying, so the tables always exist by the time the
      # new code runs. Every statement is IF NOT EXISTS, so this is a no-op after the first.
      #
      # Deliberately non-blocking. CLOUDFLARE_API_TOKEN was issued from the "Edit
      # Cloudflare Workers" template before that template included D1, so it currently
      # returns "Authentication error [code: 10000]" here. A schema that is already
      # applied must not stop the Worker deploying — that would turn a missing permission
      # into an outage. The warning below says exactly what to fix, and once the token is
      # re-issued this step becomes authoritative again with no further change.
      - name: Apply D1 schema
        continue-on-error: true
        id: d1schema
        run: npx wrangler@latest d1 execute channel-command --remote --file schema.sql
      - name: Warn if the schema could not be applied
        if: steps.d1schema.outcome == 'failure'
        run: |
          echo "::warning::D1 schema was NOT applied — CLOUDFLARE_API_TOKEN is missing the D1 permission."
          echo "::warning::Re-create the token at dash.cloudflare.com/profile/api-tokens using the"
          echo "::warning::'Edit Cloudflare Workers' template (which now includes D1) and update the"
          echo "::warning::CLOUDFLARE_API_TOKEN repo secret. The deploy below still proceeded."
      # Deploy so the Worker exists (this also applies the KV and D1 bindings and the
      # every-minute cron trigger from wrangler.toml).
      - name: Deploy Worker
        run: npx wrangler@latest deploy
      # Then push the runtime secrets from GitHub secrets (idempotent — overwrites).
      - name: Sync runtime secrets
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          printf '%s' "$YT_API_KEY" | npx wrangler@latest secret put YT_API_KEY
          printf '%s' "$CHANNEL_ID" | npx wrangler@latest secret put CHANNEL_ID
          printf '%s' "$GEMINI_KEY" | npx wrangler@latest secret put GEMINI_KEY
          # NOTE: TIKTOK_CLIENT_KEY is deliberately NOT pushed as a secret. It lives in
          # wrangler.toml [vars] because it isn't sensitive, and Cloudflare rejects the same
          # binding name existing as both a var and a secret ("already in use", code 10053).
          echo "TIKTOK_CLIENT_KEY comes from wrangler.toml [vars] — not pushed as a secret"
          if [ -n "$TIKTOK_CLIENT_SECRET" ]; then
            printf '%s' "$TIKTOK_CLIENT_SECRET" | npx wrangler@latest secret put TIKTOK_CLIENT_SECRET
          else echo "TIKTOK_CLIENT_SECRET not set — skipping"; fi
