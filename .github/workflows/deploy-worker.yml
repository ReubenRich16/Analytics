name: Deploy per-minute Worker to Cloudflare

# Deploys worker/ to Cloudflare and pushes the runtime secrets from GitHub secrets,
# so the keys live only in GitHub (for the robot) and Cloudflare (as encrypted Worker
# secrets) — never in the repo. Runs on any change to the Worker, or on demand.
on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler requires Node >= 22
      # Apply the D1 schema before deploying, so the tables always exist by the time the
      # new code runs. Every statement is IF NOT EXISTS, so this is a no-op after the first.
      #
      # Deliberately non-blocking — and CORRECTING an earlier comment here: this step has
      # in fact failed on EVERY run to date ("Authentication error [code: 10000]"), because
      # CLOUDFLARE_API_TOKEN has no D1 permission. An earlier version of this comment
      # called the first failure a transient propagation blip and claimed a later run
      # succeeded; that was a misreading — continue-on-error makes a failed step's
      # conclusion read "success" in the step list, and only the warning step below tells
      # the truth. The live schema is currently correct because it was applied out-of-band
      # through the Cloudflare connector. To make this step real: edit the token at
      # dash.cloudflare.com/profile/api-tokens, add "Account / D1 / Edit", and update the
      # repo secret. Non-blocking stays right either way — a schema step must never turn
      # a deploy into an outage.
      - name: Apply D1 schema
        continue-on-error: true
        id: d1schema
        run: npx wrangler@latest d1 execute channel-command --remote --file schema.sql
      - name: Warn if the schema could not be applied
        if: steps.d1schema.outcome == 'failure'
        run: |
          echo "::warning::D1 schema was NOT applied. The deploy below still proceeded, so this is"
          echo "::warning::only a problem if schema.sql changed in this commit."
          echo "::warning::If it is a one-off, re-run this workflow — a newly created database can"
          echo "::warning::take a couple of minutes to be visible to every Cloudflare API edge."
          echo "::warning::If it keeps failing, CLOUDFLARE_API_TOKEN is missing Account -> D1 -> Edit."
          echo "::warning::EDIT the existing token at dash.cloudflare.com/profile/api-tokens and add"
          echo "::warning::that permission — editing keeps the same token value, so the repo secret"
          echo "::warning::does NOT need updating. Only 'Roll' changes the value. If you re-create the"
          echo "::warning::token instead, you must also update the CLOUDFLARE_API_TOKEN repo secret."
      # Deploy so the Worker exists (this also applies the KV and D1 bindings and the
      # every-minute cron trigger from wrangler.toml).
      - name: Deploy Worker
        run: npx wrangler@latest deploy
      # Then push the runtime secrets from GitHub secrets (idempotent — overwrites).
      - name: Sync runtime secrets
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          printf '%s' "$YT_API_KEY" | npx wrangler@latest secret put YT_API_KEY
          printf '%s' "$CHANNEL_ID" | npx wrangler@latest secret put CHANNEL_ID
          printf '%s' "$GEMINI_KEY" | npx wrangler@latest secret put GEMINI_KEY
          # NOTE: TIKTOK_CLIENT_KEY is deliberately NOT pushed as a secret. It lives in
          # wrangler.toml [vars] because it isn't sensitive, and Cloudflare rejects the same
          # binding name existing as both a var and a secret ("already in use", code 10053).
          echo "TIKTOK_CLIENT_KEY comes from wrangler.toml [vars] — not pushed as a secret"
          if [ -n "$TIKTOK_CLIENT_SECRET" ]; then
            printf '%s' "$TIKTOK_CLIENT_SECRET" | npx wrangler@latest secret put TIKTOK_CLIENT_SECRET
          else echo "TIKTOK_CLIENT_SECRET not set — skipping"; fi
