<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Channel Command">
  <defs>
    <!-- warm plum-black ground: a room at night, never a clinical void -->
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#251b2c"/>
      <stop offset="0.55" stop-color="#1c1421"/>
      <stop offset="1" stop-color="#150e18"/>
    </linearGradient>
    <!-- the disturbance warms the space around its origin -->
    <radialGradient id="warmth" cx="0.27" cy="0.74" r="0.80">
      <stop offset="0" stop-color="#e8698f" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#c05a72" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c05a72" stop-opacity="0"/>
    </radialGradient>
    <!-- the reading: dim at the source, incandescent at the moment of measure -->
    <linearGradient id="ascent" x1="286" y1="748" x2="812" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b0546f"/>
      <stop offset="0.30" stop-color="#cf6180"/>
      <stop offset="0.70" stop-color="#ff92b6"/>
      <stop offset="1" stop-color="#ffe6ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb3cd" stop-opacity="0.46"/>
      <stop offset="0.5" stop-color="#ff8fb3" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff8fb3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#ground)"/>
    <rect width="1024" height="1024" fill="url(#warmth)"/>

    <!-- the whole observation, scaled to hold the tile with intent -->
    <g transform="translate(-30.72,-30.72) scale(1.06)">

      <!-- PROPAGATION — concentric arcs on an accelerating interval, each thinner
           and fainter than the last: decay made visible. Swept past the quadrant
           so they read as travelling ripples, not cropped quarters. -->
      <g fill="none" stroke="#ff9dbd" stroke-linecap="round">
        <path d="M260.0 600.3 A150 150 0 0 1 434.5 768.9" stroke-width="18"  opacity="0.55"/>
        <path d="M241.2 493.9 A258 258 0 0 1 541.5 783.9" stroke-width="13"  opacity="0.40"/>
        <path d="M220.0 373.8 A380 380 0 0 1 662.3 800.9" stroke-width="9"   opacity="0.28"/>
        <path d="M196.4 239.8 A516 516 0 0 1 797.0 819.8" stroke-width="6"   opacity="0.18"/>
        <path d="M170.4  92.1 A666 666 0 0 1 945.5 840.7" stroke-width="4"   opacity="0.11"/>
      </g>

      <!-- THE ASCENT — one bold gesture; the element that must survive reduction -->
      <path d="M286 748 C 500 700, 640 520, 812 268"
            fill="none" stroke="url(#ascent)" stroke-width="48" stroke-linecap="round"/>

      <!-- ORIGIN — the touch that caused everything -->
      <circle cx="286" cy="748" r="30" fill="#ffd9e4" opacity="0.94"/>

      <!-- THE READING — brightest, densest moment; breaks past the outermost ring -->
      <circle cx="812" cy="268" r="118" fill="url(#halo)"/>
      <circle cx="812" cy="268" r="52"  fill="#ffe9f0"/>
      <circle cx="812" cy="268" r="21"  fill="#ffffff"/>

      <!-- registration marks: a system implied beyond the frame, felt not read -->
      <g stroke="#ffd9e4" stroke-width="4" stroke-linecap="round" opacity="0.10">
        <path d="M118 906 L118 946"/>
        <path d="M186 922 L186 946"/>
        <path d="M254 922 L254 946"/>
        <path d="M322 922 L322 946"/>
        <path d="M390 906 L390 946"/>
      </g>
    </g>

    <!-- an inner light-catch along the tile edge; craft visible only up close -->
    <rect x="1" y="1" width="1022" height="1022" rx="227" ry="227"
          fill="none" stroke="#ffd9e4" stroke-opacity="0.08" stroke-width="2"/>
  </g>
</svg>
