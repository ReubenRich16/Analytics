# Cloudflare Worker config for the per-minute offline tracker.
# Deploy steps are in ../README.md ("Per-minute offline tracker").

name = "yt"
main = "worker.js"
compatibility_date = "2024-11-01"

# Runs the tracker every minute. Cloudflare's free plan allows cron triggers.
[triggers]
crons = ["* * * * *"]

# A KV namespace stores the recorded minute samples. This id points at the
# "MINUTE" namespace already created on the account — no need to change it.
# (A KV namespace id is not a secret; it's just an identifier scoped to your account.)
[[kv_namespaces]]
binding = "MINUTE"
id = "24a3e8ab02904af499a07b6928687b48"

# D1 holds the minute-by-minute launch samples. KV's free tier allows 1,000 writes a
# day, which two or three uploads across both platforms exhaust before lunchtime — a
# hot post costs one write per minute. D1's free tier allows 100,000 rows a day, so the
# same load sits around 17% and the launch window can go from 6 hours to 48, kept for
# 60 days instead of 3. Schema lives in schema.sql and is applied on every deploy.
# (A database id is not a secret; like the KV id it only names a resource in the account.)
[[d1_databases]]
binding = "DB"
database_name = "channel-command"
database_id = "2fb6f33e-1437-4269-83a9-b452515dc330"

# The TikTok client key is NOT a secret — it is sent in the browser's own OAuth URL,
# exactly like a Google OAuth Client ID. Keeping it here means only the client *secret*
# has to be managed as a secret. Update this if the app moves from Sandbox to production
# (the "sb" prefix marks a Sandbox credential).
[vars]
TIKTOK_CLIENT_KEY = "sbawwsui0uvmik0odt"

# Secrets (set with the commands below, never in this file or git):
#   npx wrangler secret put YT_API_KEY    # public YouTube key (per-minute tracker)
#   npx wrangler secret put CHANNEL_ID    # UCyours,UCpartners (tracked + AI-allowed channels)
#   npx wrangler secret put GEMINI_KEY    # OPTIONAL — enables the owner-locked Idea Studio AI
# GEMINI_KEY is only needed if you want the Worker to power the AI ideas. When set, the
# Worker answers /ai only for a signed-in YouTube account listed in CHANNEL_ID, so the key
# stays secret and only you and your partner can use it.
